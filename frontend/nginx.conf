server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Lightweight health endpoint for the ALB target group health check.
    # Returns 200 without touching the filesystem so it stays fast and cheap.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Static SPA. Any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small hardening touches
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
